# Configuration file for Spider-Man Game Trainer
# Edit offsets, base pointers, hotkeys and options here.

[Process]
# Executable name of the game
target_process = spiderman.exe
# Interval in seconds to check for process availability
poll_interval = 1.0

[Cheats]
# God Mode (Infinite Health)
god_mode_enabled = false
# Multi-level pointer offset from base module (e.g. spiderman.exe+0x01A2B3C0)
# Format: offset1,offset2,offset3...
health_base_offset = 0x0
health_pointer_offsets = 0x0

# Infinite Focus / Web Shooters
infinite_focus_enabled = false
focus_base_offset = 0x0
focus_pointer_offsets = 0x0

# Infinite Gadgets & Ammo
infinite_gadgets_enabled = false
gadgets_base_offset = 0x0
gadgets_pointer_offsets = 0x0

# Max Combo
max_combo_enabled = false
combo_base_offset = 0x0
combo_pointer_offsets = 0x0

# Resources / Tokens / Skill Points
infinite_tokens_enabled = false
tokens_base_offset = 0x0
tokens_pointer_offsets = 0x0

# Super Speed / Speedhack
speedhack_enabled = false
speed_multiplier = 2.0
speed_base_offset = 0x0
speed_pointer_offsets = 0x0

[Hotkeys]
# Global hotkey mapping
toggle_god_mode = num 1
toggle_infinite_focus = num 2
toggle_infinite_gadgets = num 3
toggle_max_combo = num 4
toggle_infinite_tokens = num 5
toggle_speedhack = num 6
